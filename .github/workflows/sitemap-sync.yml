name: Sitemap sync

# Su ogni push a main rigenera sitemap.xml (nuove pagine + lastmod dal git log) e la committa se cambia.
on:
  push:
    branches: [main]
    paths: ['**.html']

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-sitemap.mjs
      - name: Commit se cambiata
        run: |
          if ! git diff --quiet sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore(sitemap): aggiorna sitemap.xml [skip ci]"
            git push
          fi
