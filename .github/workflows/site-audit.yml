name: Site audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit SEO, link, JSON-LD, immagini, regole di contenuto
        run: node scripts/audit.mjs
      - name: Sitemap allineata alle pagine
        run: node scripts/build-sitemap.mjs --check
      - name: Uno di Uno, libreria contenuti valida e allineata
        run: node scripts/build-uno-di-uno.mjs --check
